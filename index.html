<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BOXIN Website Mockup Preview</title>
  <style>
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f5f7fa; color: #1f2937; }
    header { position: sticky; top: 0; background: #fff; border-bottom: 1px solid #e5e7eb; padding: 16px 24px; z-index: 10; }
    header h1 { margin: 0 0 6px; font-size: 22px; }
    nav a { color: #0b5db3; text-decoration: none; margin-right: 16px; font-weight: 600; }
    section { max-width: 1180px; margin: 28px auto; padding: 0 18px; }
    h2 { border-left: 5px solid #e21b2d; padding-left: 10px; }
    .mockup { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.06); }
    .mockup img { width: 100%; display: block; border-radius: 8px; }
    .note { color: #4b5563; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>BOXIN Website Mockup Preview</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#about">About Us</a>
      <a href="#contact">Contact Us</a>
      <a href="#faq">FAQ</a>
    </nav>
  </header>
  <section class="note">
    This preview is for quick browsing of the design mockups. Production websites should rebuild these layouts with HTML text, responsive CSS, optimized images and CMS data.
  </section>
  <section id="home"><h2>Home</h2><div class="mockup"><img src="assets/01_homepage.png" alt="BOXIN homepage mockup"></div></section>
  <section id="about"><h2>About Us</h2><div class="mockup"><img src="assets/02_about_us.png" alt="BOXIN about us mockup"></div></section>
  <section id="contact"><h2>Contact Us</h2><div class="mockup"><img src="assets/03_contact_us.png" alt="BOXIN contact us mockup"></div></section>
  <section id="faq"><h2>FAQ</h2><div class="mockup"><img src="assets/04_faq.png" alt="BOXIN FAQ mockup"></div></section>
</body>
</html>
